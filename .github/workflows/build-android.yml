name: Build APK Android (debug)

on:
  workflow_dispatch:
  push:
    paths: ['android/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Beri izin eksekusi gradlew (hilang saat upload zip)
        run: chmod +x gradlew

      - name: Tes unit (parser M3U)
        run: ./gradlew testDebugUnitTest

      - name: Build APK debug (sudah ditandatangani kunci debug, bisa langsung dipasang)
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WdkTVPlayer-debug
          path: android/app/build/outputs/apk/debug/*.apk
