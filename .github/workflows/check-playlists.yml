name: Cek Playlist (mingguan)

on:
  schedule:
    - cron: '0 3 * * 1'        # Senin 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Uji semua playlist
        run: |
          python tools/check_playlist.py streams/playlist_super.m3u -o out/super --workers 30
          python tools/check_playlist.py playlist_super.m3u        -o out/root  --workers 30
      - name: Ringkasan di halaman run
        run: |
          cat out/super/report.md >> "$GITHUB_STEP_SUMMARY"
          cat out/root/report.md  >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hasil-cek-playlist
          path: out/
